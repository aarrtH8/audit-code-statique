name: Audit de dépôt public

# Guichet sans serveur public : un inconnu ouvre une issue contenant une URL de dépôt
# GitHub public, ce workflow lance l'analyse et publie le rapport en commentaire.
on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extraire l'URL de dépôt du corps de l'issue
        id: cible
        env:
          CORPS: ${{ github.event.issue.body }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const corps = process.env.CORPS || '';
          // Regex stricte : uniquement github.com/<owner>/<repo>
          const m = corps.match(/github\.com\/([A-Za-z0-9_.-]+)\/([A-Za-z0-9_.-]+)/);
          const sortie = process.env.GITHUB_OUTPUT;
          if (!m) {
            fs.appendFileSync(sortie, 'valide=false\n');
            console.log('Aucune URL de dépôt GitHub trouvée dans le corps de l issue.');
            process.exit(0);
          }
          const cible = m[1] + '/' + m[2].replace(/\.git$/, '');
          fs.appendFileSync(sortie, 'valide=true\n');
          fs.appendFileSync(sortie, 'ref=' + cible + '\n');
          console.log('Cible :', cible);
          NODE

      - name: Produire le rapport
        id: rapport
        if: steps.cible.outputs.valide == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node tools/audit-depot-dist.mjs "${{ steps.cible.outputs.ref }}" --max-fichiers 200 --out rapport.md
          echo "--- début du rapport ---"
          head -30 rapport.md
          echo "--- fin ---"

      - name: Publier le rapport en commentaire de l issue
        if: steps.cible.outputs.valide == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          {
            echo "## Rapport d'analyse"
            echo ""
            cat rapport.md
            echo ""
            echo "---"
            echo "_Analyse automatique, honnête sur ses limites. Une relecture humaine avec correctifs priorisés se chiffre sur devis après accord._"
          } > commentaire.md
          gh issue comment "$NUM" --body-file commentaire.md

      - name: Répondre si aucune URL exploitable
        if: steps.cible.outputs.valide != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          cat > reponse.md <<'TXT'
          Aucune URL de dépôt GitHub exploitable n'a été trouvée dans ce message.

          Ce guichet analyse uniquement des dépôts **publics**. Écrivez une ligne de la forme :

          ```
          https://github.com/proprietaire/depot
          ```

          Le rapport sera publié automatiquement en commentaire ici.
          TXT
          gh issue comment "$NUM" --body-file reponse.md
